<!doctype html>
<html lang="en-PH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TRACK — Tracking Requirements, Attendance, and Communication for Kiwalan National High School, Iligan City."
    />
    <meta name="theme-color" content="#0f2044" />

    <!-- Link previews (Messenger, Facebook, Viber, X). Crawlers need an
         absolute image URL or they drop the preview entirely, so the origin
         comes from VITE_SITE_URL in .env — update it when deploying. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TRACK" />
    <meta property="og:title" content="TRACK · Tracking Requirements, Attendance &amp; Communication" />
    <meta
      property="og:description"
      content="Tracking Requirements, Attendance, and Communication for Kiwalan National High School, Iligan City."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TRACK — Tracking Requirements, Attendance, and Communication" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TRACK · Tracking Requirements, Attendance &amp; Communication" />
    <meta
      name="twitter:description"
      content="Tracking Requirements, Attendance, and Communication for Kiwalan National High School, Iligan City."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Campus backdrops are CSS backgrounds, so they can't be lazy-loaded —
         deferring them would only delay the hero paint. Instead we warm both
         origins (the generator API and the CDN it redirects to, which caches
         the bytes for ~30 days) and fetch the images at the highest priority
         so they are decoded by the time the landing/login panels paint,
         instead of flashing the flat navy fallback. -->
    <link rel="preconnect" href="https://coresg-normal.trae.ai" />
    <link rel="dns-prefetch" href="https://coresg-normal.trae.ai" />
    <link rel="preconnect" href="https://lf-cdn.trae.ai" crossorigin />
    <link rel="dns-prefetch" href="https://lf-cdn.trae.ai" />
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="https://coresg-normal.trae.ai/api/ide/v1/text_to_image?prompt=Wide%20architectural%20photograph%20of%20a%20Philippine%20public%20high%20school%20campus%2C%20Kiwalan%20National%20High%20School%2C%20two-storey%20concrete%20classroom%20building%20painted%20white%20and%20green%2C%20open%20walkway%20with%20no%20roof%20or%20canopy%2C%20flagpole%2C%20tropical%20palm%20trees%2C%20blue%20sky%2C%20bright%20daylight&amp;image_size=landscape_16_9"
    />
    <link
      rel="preload"
      as="image"
      fetchpriority="low"
      href="https://coresg-normal.trae.ai/api/ide/v1/text_to_image?prompt=Tall%20portrait%20photograph%20of%20a%20Philippine%20public%20high%20school%20campus%2C%20Kiwalan%20National%20High%20School%2C%20two-storey%20concrete%20classroom%20building%20painted%20white%20and%20green%2C%20open%20walkway%20with%20no%20roof%20or%20canopy%2C%20flagpole%2C%20tropical%20palm%20trees%2C%20blue%20sky%2C%20bright%20daylight&amp;image_size=portrait_16_9"
    />

    <title>TRACK · Tracking Requirements, Attendance &amp; Communication</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
